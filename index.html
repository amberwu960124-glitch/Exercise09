<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Exercise 09</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            width: 500px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        /* 第一個區塊：雙線邊框、淺藍色背景 */
        .box1 {
            background-color: #d0e8f2;
            border: 4px double #ff5733; /* 雙線邊框與橘紅色 */
        }

        /* 第二個區塊：圓角、黃色背景、藍色邊框 */
        .box2 {
            background-color: #ffff00;
            border: 2px solid #00a8ff;
            border-radius: 15px; /* 圓角效果 */
        }

        /* 第三個區塊：綠色背景、點狀邊框 */
        .box3 {
            background-color: #2ecc71;
            border: 5px dotted #7f8c8d; /* 點狀邊框 */
        }
    </style>
</head>
<body>

    <!-- 第一個 Hello World 區塊 -->
    <div class="box box1">
        Hello World
    </div>

    <!-- 第二個 Hello World 區塊 -->
    <div class="box box2">
        Hello World
    </div>

    <!-- 第三個 Hello World 區塊 -->
    <div class="box box3">
        Hello World
    </div>

</body>
</html>
